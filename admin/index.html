<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Visual Pro | @veinti5co</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0b0b0b] text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- TOPBAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <span class="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-lg text-xs">25</span>
            <h1 class="font-extrabold text-sm tracking-wide">Editor Visual Táctil & Sincronizador GitHub</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="checkGitHubConnection()" id="connection-badge" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Verificar Token
            </button>
            <button onclick="saveToGitHub()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-extrabold text-xs rounded-lg shadow-lg transition">Guardar y Publicar en Vivo</button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- PANEL IZQUIERDO DE EDICIÓN -->
        <aside class="w-full md:w-[460px] bg-slate-950 border-r border-slate-800 flex flex-col shrink-0">
            <!-- Pestañas -->
            <div class="flex border-b border-slate-800 bg-slate-900/50 text-xs font-bold text-slate-400">
                <button onclick="switchTab('branding')" id="tab-branding" class="flex-1 py-3 text-center border-b-2 border-amber-400 text-amber-400 transition">Marca & Banner</button>
                <button onclick="switchTab('products')" id="tab-products" class="flex-1 py-3 text-center transition">Productos</button>
                <button onclick="switchTab('promos')" id="tab-promos" class="flex-1 py-3 text-center transition">Promos & Video</button>
                <button onclick="switchTab('media')" id="tab-media" class="flex-1 py-3 text-center transition">Música & Redes</button>
            </div>

            <!-- Contenido Pestañas -->
            <div id="editor-content" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        </aside>

        <!-- VISTA PREVIA DERECHA -->
        <main class="flex-1 bg-slate-950 flex flex-col overflow-hidden">
            <div class="bg-slate-900/70 border-b border-slate-800 px-4 py-2 flex items-center justify-between text-xs text-slate-400 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span class="ml-2 font-mono text-[11px] text-slate-500">Vista Previa Interactiva en Vivo</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="setPreviewWidth('100%')" class="px-2 py-0.5 bg-slate-800 rounded text-[11px] hover:text-white">Desktop</button>
                    <button onclick="setPreviewWidth('390px')" class="px-2 py-0.5 bg-slate-800 rounded text-[11px] hover:text-white">Móvil</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 flex justify-center bg-[#070707]">
                <div id="preview-frame" style="width: 100%; max-width: 1100px;" class="rounded-2xl border border-slate-800 shadow-2xl transition-all duration-300 flex flex-col h-fit mb-12">
                    <iframe id="live-preview-iframe" src="../index.html" class="w-full h-[850px] rounded-2xl bg-black border-0"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL GITHUB TOKEN -->
    <div id="gh-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 max-w-md w-full p-6 rounded-2xl shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white">Conectar Repositorio GitHub</h3>
            <p class="text-xs text-slate-400 leading-relaxed">Para guardar tus cambios, fotos y canciones directamente en tu repositorio, ingresa tu GitHub Personal Access Token (Classic) con permiso <code>repo</code>.</p>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 block mb-1">Usuario / Organización</label>
                    <input type="text" id="gh-owner" value="veinti5co" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 block mb-1">Repositorio</label>
                    <input type="text" id="gh-repo" value="veinti5co-web" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 block mb-1">GitHub Token (ghp_...)</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeGhModal()" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-300">Cerrar</button>
                <button onclick="saveGhCredentials()" class="px-4 py-2 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white">Guardar Credenciales</button>
            </div>
        </div>
    </div>

    <script>
        let storeData = {
            branding: { storeName: "@veinti5co", logoUrl: "", faviconUrl: "", fontFamily: "'Plus Jakarta Sans', sans-serif", bgColor: "#0b0b0b", cardBgColor: "#141414", textColor: "#f3f3f3", accentColor: "#facc15" },
            banner: { enabled: true, title: "Arte Personalizado & Cuadros de Colección", subtitle: "Diseños Exclusivos de tu música, artista y álbum favorito.", imageUrl: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=1200", ctaText: "Ver Promoción Especial", ctaLink: "#catalogo", height: 420 },
            products: [],
            promotions: [],
            foundersVideo: { enabled: true, title: "Detrás de @veinti5co", subtitle: "Conoce nuestra historia y el proceso de creación.", youtubeUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" },
            trustStats: [{ value: "+500", label: "Envíos Seguros" }, { value: "100%", label: "Garantía de Calidad" }, { value: "Nequi", label: "Pago Directo" }],
            playlist: [],
            contact: { whatsappNumber: "573001234567", whatsappDisplay: "+57 300 123 4567", spotifyUrl: "https://spotify.com", socials: [{ name: "Instagram", url: "https://instagram.com/veinti5co" }] }
        };

        let currentTab = 'branding';

        async function loadInitialData() {
            try {
                const res = await fetch(`../data.json?t=${Date.now()}`);
                if (res.ok) {
                    storeData = await res.json();
                }
            } catch (e) { console.log("Usando datos por defecto"); }
            renderAdminTabs();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['branding', 'products', 'promos', 'media'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-3 text-center border-b-2 border-amber-400 text-amber-400 font-bold transition";
                } else {
                    btn.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition";
                }
            });
            renderAdminTabs();
        }

        function renderAdminTabs() {
            const container = document.getElementById('editor-content');
            if (currentTab === 'branding') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-sm font-black text-amber-400 uppercase tracking-wider">Identidad Visual & Banner</h2>
                        <div>
                            <label class="text-xs font-bold text-slate-300 block mb-1">Nombre de la Tienda</label>
                            <input type="text" value="${storeData.branding.storeName}" oninput="storeData.branding.storeName = this.value; renderLivePreview();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Logo Principal</label>
                                <label class="block text-center bg-slate-900 border border-slate-700 hover:bg-slate-800 rounded-lg p-2.5 text-xs font-bold cursor-pointer">Subir Logo<input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'branding', 'logoUrl')"></label>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Favicon Pestaña</label>
                                <label class="block text-center bg-slate-900 border border-slate-700 hover:bg-slate-800 rounded-lg p-2.5 text-xs font-bold cursor-pointer">Subir Favicon<input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'branding', 'faviconUrl')"></label>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-800 space-y-3">
                            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Imagen del Banner Principal</h3>
                            <p class="text-[11px] text-slate-400">Aquí puedes subir o cambiar la imagen de la sala o estudio que va de fondo en la parte superior.</p>
                            <div>
                                <label class="block text-center bg-slate-900 border border-slate-700 hover:bg-slate-800 rounded-lg p-3 text-xs font-bold cursor-pointer">🖼️ Subir Imagen de Fondo del Banner<input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'banner', 'imageUrl')"></label>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Título del Banner</label>
                                <input type="text" value="${storeData.banner.title}" oninput="storeData.banner.title = this.value; renderLivePreview();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800">
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Fondo Web</label>
                                <input type="color" value="${storeData.branding.bgColor}" onchange="storeData.branding.bgColor = this.value; renderLivePreview();" class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Color Tarjetas</label>
                                <input type="color" value="${storeData.branding.cardBgColor}" onchange="storeData.branding.cardBgColor = this.value; renderLivePreview();" class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Color Texto</label>
                                <input type="color" value="${storeData.branding.textColor}" onchange="storeData.branding.textColor = this.value; renderLivePreview();" class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-300 block mb-1">Color Botones</label>
                                <input type="color" value="${storeData.branding.accentColor}" onchange="storeData.branding.accentColor = this.value; renderLivePreview();" class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer">
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'products') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-black text-amber-400 uppercase tracking-wider">Catálogo de Cuadros</h2>
                            <button onclick="addProduct()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold">+ Nuevo Cuadro</button>
                        </div>
                        <div class="space-y-4">
                            ${storeData.products.map((p, pIdx) => `
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-3">
                                    <div class="flex items-center justify-between">
                                        <input type="text" value="${p.title}" oninput="storeData.products[${pIdx}].title = this.value; renderLivePreview();" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-bold text-white w-2/3">
                                        <button onclick="removeProduct(${pIdx})" class="text-rose-400 text-xs font-bold px-2 py-1 bg-rose-500/10 rounded-lg">Eliminar</button>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="text-[10px] text-slate-400 block mb-1">Categoría</label>
                                            <input type="text" value="${p.category}" oninput="storeData.products[${pIdx}].category = this.value; renderLivePreview();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
                                        </div>
                                        <div>
                                            <label class="text-[10px] text-slate-400 block mb-1">Etiqueta (Opcional)</label>
                                            <input type="text" value="${p.badge || ''}" oninput="storeData.products[${pIdx}].badge = this.value; renderLivePreview();" placeholder="Ej: TOP VENTAS" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-400 block mb-1">Imagen del Cuadro</label>
                                        <label class="block text-center bg-slate-950 border border-slate-700 hover:bg-slate-800 rounded-lg p-2 text-xs font-bold cursor-pointer">Cambiar Imagen<input type="file" accept="image/*" class="hidden" onchange="uploadProductImage(event, ${pIdx})"></label>
                                    </div>
                                    <div class="pt-2 border-t border-slate-800 space-y-2">
                                        <span class="text-[11px] font-bold text-slate-300">Medidas & Precios (Marco Delgado / Grueso):</span>
                                        ${p.sizes.map((sz, sIdx) => `
                                            <div class="grid grid-cols-4 gap-1.5 items-center bg-slate-950 p-2 rounded-lg">
                                                <input type="text" value="${sz.label}" oninput="storeData.products[${pIdx}].sizes[${sIdx}].label = this.value; renderLivePreview();" class="bg-slate-900 border border-slate-800 rounded px-1.5 py-1 text-xs text-center font-bold">
                                                <input type="number" value="${sz.thinPrice}" oninput="storeData.products[${pIdx}].sizes[${sIdx}].thinPrice = Number(this.value); renderLivePreview();" class="bg-slate-900 border border-slate-800 rounded px-1.5 py-1 text-xs text-center" placeholder="Delgado">
                                                <input type="number" value="${sz.thickPrice}" oninput="storeData.products[${pIdx}].sizes[${sIdx}].thickPrice = Number(this.value); renderLivePreview();" class="bg-slate-900 border border-slate-800 rounded px-1.5 py-1 text-xs text-center" placeholder="Grueso">
                                                <label class="flex items-center gap-1 text-[10px] justify-center cursor-pointer"><input type="checkbox" ${sz.soldOut ? 'checked' : ''} onchange="storeData.products[${pIdx}].sizes[${sIdx}].soldOut = this.checked; renderLivePreview();"> Agotado</label>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'promos') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-sm font-black text-amber-400 uppercase tracking-wider">Promociones & Video YouTube</h2>
                        <div>
                            <label class="text-xs font-bold text-slate-300 block mb-1">URL Video YouTube Fundadores</label>
                            <input type="text" value="${storeData.foundersVideo.youtubeUrl}" oninput="storeData.foundersVideo.youtubeUrl = this.value; renderLivePreview();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                        </div>
                    </div>
                `;
            } else if (currentTab === 'media') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-black text-amber-400 uppercase tracking-wider">Reproductor & Redes</h2>
                            <button onclick="addTrack()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold">+ Añadir Pista MP3</button>
                        </div>
                        <div class="space-y-3">
                            ${storeData.playlist.map((tr, idx) => `
                                <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-xl space-y-2.5">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold text-amber-400">Pista #${idx + 1}</span>
                                        <button onclick="removeTrack(${idx})" class="text-rose-400 text-xs font-bold">Eliminar</button>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="text" value="${tr.title}" oninput="storeData.playlist[${idx}].title = this.value; renderLivePreview();" placeholder="Título" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                                        <input type="text" value="${tr.artist}" oninput="storeData.playlist[${idx}].artist = this.value; renderLivePreview();" placeholder="Artista" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                                    </div>
                                    <div class="flex gap-2">
                                        <label class="flex-1 text-[11px] bg-slate-950 hover:bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 cursor-pointer text-center font-semibold">
                                            🖼️ Subir Portada
                                            <input type="file" accept="image/*" class="hidden" onchange="uploadTrackCover(event, ${idx})">
                                        </label>
                                        <label class="flex-1 text-[11px] bg-slate-950 hover:bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 cursor-pointer text-center font-semibold">
                                            🎵 Subir MP3
                                            <input type="file" accept="audio/mp3,audio/*" class="hidden" onchange="uploadTrackAudio(event, ${idx})">
                                        </label>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-800 space-y-3">
                            <h3 class="text-xs font-bold text-slate-300">WhatsApp & Enlace Spotify</h3>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Número de WhatsApp (ej: 573001234567)</label>
                                <input type="text" value="${storeData.contact.whatsappNumber}" oninput="storeData.contact.whatsappNumber = this.value; renderLivePreview();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Enlace de Playlist de Spotify</label>
                                <input type="text" value="${storeData.contact.spotifyUrl || ''}" oninput="storeData.contact.spotifyUrl = this.value; renderLivePreview();" placeholder="https://spotify.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-800 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-slate-300">Redes Sociales Ilimitadas</span>
                                <button onclick="addSocialLink()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-[11px] font-bold">+ Añadir Red</button>
                            </div>
                            <div class="space-y-2">
                                ${(storeData.contact.socials || []).map((soc, sIdx) => `
                                    <div class="flex gap-2 items-center">
                                        <input type="text" value="${soc.name}" oninput="storeData.contact.socials[${sIdx}].name = this.value; renderLivePreview();" placeholder="Red" class="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                                        <input type="text" value="${soc.url}" oninput="storeData.contact.socials[${sIdx}].url = this.value; renderLivePreview();" placeholder="https://..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                                        <button onclick="removeSocialLink(${sIdx})" class="px-2 py-1.5 bg-rose-500/20 text-rose-400 rounded-lg text-xs font-bold">✕</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
            renderLivePreview();
        }

        function renderLivePreview() {
            const iframe = document.getElementById('live-preview-iframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.storeData = JSON.parse(JSON.stringify(storeData));
                    iframe.contentWindow.renderStore();
                } catch (e) {}
            }
        }

        function setPreviewWidth(w) {
            document.getElementById('preview-frame').style.maxWidth = w;
        }

        function addProduct() {
            storeData.products.push({
                id: "prod-" + Date.now(),
                title: "Nuevo Cuadro Exclusivo",
                category: "Álbumes & Música",
                badge: "NUEVO",
                images: ["https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600"],
                sizes: [
                    { label: "30x40 cm", thinPrice: 65000, thickPrice: 85000, soldOut: false },
                    { label: "40x50 cm", thinPrice: 95000, thickPrice: 115000, soldOut: false },
                    { label: "50x70 cm", thinPrice: 140000, thickPrice: 170000, soldOut: false }
                ]
            });
            renderAdminTabs();
        }

        function removeProduct(idx) { storeData.products.splice(idx, 1); renderAdminTabs(); }

        function addTrack() {
            if (!storeData.playlist) storeData.playlist = [];
            storeData.playlist.push({ title: "Nueva Pista", artist: "@veinti5co", cover: "", audioData: "" });
            renderAdminTabs();
        }

        function removeTrack(idx) { storeData.playlist.splice(idx, 1); renderAdminTabs(); }

        function addSocialLink() {
            if (!storeData.contact.socials) storeData.contact.socials = [];
            storeData.contact.socials.push({ name: "Nueva Red", url: "https://" });
            renderAdminTabs();
        }

        function removeSocialLink(idx) { storeData.contact.socials.splice(idx, 1); renderAdminTabs(); }

        function uploadImage(event, targetObj, targetProp) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                storeData[targetObj][targetProp] = e.target.result;
                renderAdminTabs();
                renderLivePreview();
            };
            reader.readAsDataURL(file);
        }

        function uploadProductImage(event, pIdx) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                storeData.products[pIdx].images[0] = e.target.result;
                renderAdminTabs();
                renderLivePreview();
            };
            reader.readAsDataURL(file);
        }

        function uploadTrackCover(event, idx) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                storeData.playlist[idx].cover = e.target.result;
                renderAdminTabs();
                renderLivePreview();
            };
            reader.readAsDataURL(file);
        }

        function uploadTrackAudio(event, idx) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                storeData.playlist[idx].audioData = e.target.result;
                renderAdminTabs();
                renderLivePreview();
                alert("¡Pista MP3 cargada con éxito!");
            };
            reader.readAsDataURL(file);
        }

        function checkGitHubConnection() {
            const token = localStorage.getItem('gh_token');
            if (token) {
                alert("Token de GitHub conectado correctamente en este navegador.");
            } else {
                document.getElementById('gh-modal').classList.remove('hidden');
                document.getElementById('gh-modal').classList.add('flex');
            }
        }

        function closeGhModal() {
            document.getElementById('gh-modal').classList.add('hidden');
            document.getElementById('gh-modal').classList.remove('flex');
        }

        function saveGhCredentials() {
            const token = document.getElementById('gh-token').value.trim();
            if (!token) { alert("Ingresa un token válido"); return; }
            localStorage.setItem('gh_token', token);
            closeGhModal();
            alert("¡Credenciales guardadas con éxito!");
        }

        async function saveToGitHub() {
            const token = localStorage.getItem('gh_token');
            if (!token) { checkGitHubConnection(); return; }

            const owner = document.getElementById('gh-owner').value;
            const repo = document.getElementById('gh-repo').value;
            const path = "data.json";
            const content = JSON.stringify(storeData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(content)));

            try {
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                
                let sha = undefined;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Update store via Visual Admin Pro",
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("¡Cambios publicados en vivo con éxito en GitHub Pages! (Tardará 1 minuto en reflejarse)");
                } else {
                    const err = await putRes.json();
                    alert("Error al guardar: " + (err.message || 'Desconocido'));
                }
            } catch (e) {
                alert("Error de red al conectar con GitHub.");
            }
        }

        loadInitialData();
    </script>
</body>
</html>
