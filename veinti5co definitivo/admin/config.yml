backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "configuracion"
    label: "Configuración General"
    files:
      - label: "Redes Sociales"
        name: "social"
        file: "content/social.json"
        fields:
          - {label: "Enlace Instagram", name: "instagram", widget: "string"}
          - {label: "Enlace TikTok", name: "tiktok", widget: "string"}

  - name: "musica"
    label: "Reproductor de Música"
    files:
      - label: "Canción Activa"
        name: "reproductor"
        file: "content/musica.json"
        fields:
          - {label: "Título de la Canción", name: "songTitle", widget: "string"}
          - {label: "Nombre del Artista", name: "artistName", widget: "string"}
          - {label: "Archivo MP3", name: "audioFile", widget: "file"}
          - {label: "Portada", name: "coverImage", widget: "image"}

  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    fields:
      - {label: "Nombre del Cuadro", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Imagen del Cuadro", name: "image", widget: "image"}
      - {label: "Precio Base", name: "price", widget: "number"}
      - {label: "Estado", name: "status", widget: "select", options: ["Disponible", "Agotado"]}