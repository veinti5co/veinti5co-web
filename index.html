<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">@veinti5co | Cuadros & Arte Exclusivo</title>
    <!-- Favicon dinámico -->
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body id="app-body" class="bg-[#0b0b0b] text-[#f3f3f3]" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <!-- HEADER / NAVEGACIÓN -->
    <header id="site-header" class="px-6 py-4 flex items-center justify-between border-b border-white/10 sticky top-0 z-40 backdrop-blur-md bg-black/40">
        <div class="flex items-center gap-3">
            <div id="header-logo-container">
                <div class="h-10 w-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-sm">25</div>
            </div>
            <h1 id="header-title" class="text-lg font-extrabold tracking-wider text-white">@VEINTI5CO</h1>
        </div>
        <div class="hidden md:flex items-center gap-6 text-xs font-semibold opacity-80">
            <a href="#catalogo" class="hover:opacity-100">Catálogo</a>
            <a href="#promociones" class="hover:opacity-100">Promociones</a>
            <a href="#fundadores" class="hover:opacity-100">Fundadores</a>
        </div>
    </header>

    <!-- BANNER PRINCIPAL DINÁMICO -->
    <div id="banner-section"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-6 py-10 w-full flex-1 space-y-16">

        <!-- CATÁLOGO DE CUADROS -->
        <section id="catalogo" class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-black tracking-tight">Catálogo de Cuadros</h2>
                    <p class="text-xs opacity-70 mt-1">Selecciona la medida y el tipo de marco de tu preferencia.</p>
                </div>
                <!-- Filtros dinámicos por categoría -->
                <div id="category-filters" class="flex flex-wrap gap-2">
                    <button onclick="filterCategory('all')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white text-black transition">Todos</button>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Inyectado dinámicamente desde data.json -->
            </div>
        </section>

        <!-- PROMOCIONES / PACKS ESPECIALES -->
        <section id="promociones" class="space-y-6">
            <div id="promos-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Inyectado dinámicamente -->
            </div>
        </section>

        <!-- VIDEO FUNDADORES YOUTUBE -->
        <section id="fundadores">
            <div id="founders-container"></div>
        </section>

        <!-- TRUST STATS & RESEÑAS -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center" id="stats-container">
            <!-- Inyectado dinámicamente -->
        </section>
    </main>

    <!-- REPRODUCTOR DE MÚSICA GOTH FLOTANTE + FOOTER -->
    <footer class="mt-auto border-t border-white/10 px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-6 bg-black/60 backdrop-blur-md">
        <!-- Reproductor de Audio Funcional -->
        <div class="flex items-center gap-3 bg-white/10 border border-white/15 px-4 py-2.5 rounded-full shadow-lg">
            <button onclick="toggleAudioPlay()" id="play-btn" class="w-8 h-8 rounded-full bg-white text-black font-bold flex items-center justify-center text-xs hover:scale-105 transition">
                ▶
            </button>
            <div class="text-left pr-2">
                <div id="track-title" class="text-xs font-bold leading-tight text-white">Cargando música...</div>
                <div id="track-artist" class="text-[10px] text-white/60">@veinti5co Goth Session</div>
            </div>
            <button onclick="nextAudioTrack()" class="text-xs text-white/70 hover:text-white px-1 font-bold">⏭</button>
        </div>

        <div class="text-center md:text-right space-y-1">
            <div id="footer-contact" class="text-xs font-bold text-white/90"></div>
            <div class="text-[11px] opacity-60">&copy; 2026 @veinti5co. Todos los derechos reservados. Pagos seguros vía Nequi.</div>
        </div>
    </footer>

    <!-- AUDIO ELEMENT OCULTO PARA REPRODUCCIÓN REAL -->
    <audio id="public-audio-player" onended="nextAudioTrack()"></audio>

    <script>
        let storeData = null;
        let activeCategory = 'all';
        let productSelections = {}; // Almacena medida y marco seleccionado por producto
        let currentTrackIdx = 0;
        let isAudioPlaying = false;

        // Cargar datos de la tienda desde data.json de forma totalmente sincronizada
        async function loadStoreData() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                if (res.ok) {
                    storeData = await res.json();
                    renderStore();
                } else {
                    console.error("No se pudo cargar data.json");
                }
            } catch (err) {
                console.error("Error al conectar con data.json:", err);
            }
        }

        function formatCOP(val) {
            return "$" + Number(val || 0).toLocaleString('es-CO') + " COP";
        }

        function renderStore() {
            if (!storeData) return;
            const b = storeData.branding;

            // 1. Aplicar estilos globales de marca
            document.getElementById('app-body').style.backgroundColor = b.bgColor;
            document.getElementById('app-body').style.color = b.textColor;
            document.getElementById('app-body').style.fontFamily = b.fontFamily;
            document.getElementById('page-title').innerText = `${b.storeName} | Cuadros & Arte Exclusivo`;
            document.getElementById('header-title').innerText = b.storeName;

            if (b.logoUrl) {
                document.getElementById('header-logo-container').innerHTML = `<img src="${b.logoUrl}" class="h-10 w-10 rounded-full object-cover border border-white/20">`;
            }
            if (b.faviconUrl) {
                document.getElementById('dynamic-favicon').href = b.faviconUrl;
            }

            // 2. Renderizar Banner Principal
            const bannerEl = document.getElementById('banner-section');
            if (storeData.banner && storeData.banner.enabled) {
                bannerEl.innerHTML = `
                    <div style="height:${storeData.banner.height}px; background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('${storeData.banner.imageUrl || 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=1200'}'); background-size:cover; background-position:center;" class="flex flex-col items-center justify-center text-center text-white px-6">
                        <h1 class="text-3xl md:text-5xl font-black max-w-2xl mb-3 tracking-tight">${storeData.banner.title}</h1>
                        <p class="text-sm md:text-base text-white/85 max-w-xl mb-6">${storeData.banner.subtitle}</p>
                        ${storeData.banner.ctaText ? `<a href="${storeData.banner.ctaLink || '#catalogo'}" style="background:${b.accentColor}" class="px-6 py-3 rounded-full text-xs font-extrabold shadow-xl hover:scale-105 transition">${storeData.banner.ctaText}</a>` : ''}
                    </div>
                `;
            } else {
                bannerEl.innerHTML = '';
            }

            // 3. Renderizar Filtros de Categorías
            const categories = ['all', ...new Set(storeData.products.map(p => p.category))];
            const filtersEl = document.getElementById('category-filters');
            filtersEl.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-bold transition ${activeCategory === cat ? 'bg-white text-black shadow-md' : 'bg-white/10 opacity-75 hover:opacity-100'}">
                    ${cat === 'all' ? 'Todos' : cat}
                </button>
            `).join('');

            // 4. Renderizar Cuadros del Catálogo
            const gridEl = document.getElementById('product-grid');
            const filteredProducts = activeCategory === 'all' ? storeData.products : storeData.products.filter(p => p.category === activeCategory);

            gridEl.innerHTML = filteredProducts.map((p) => {
                if (productSelections[p.id] === undefined) {
                    productSelections[p.id] = { sizeIdx: 0, frameType: 'thin' };
                }
                const sel = productSelections[p.id];
                const currentSize = p.sizes[sel.sizeIdx] || p.sizes[0];
                const price = sel.frameType === 'thin' ? currentSize.thinPrice : currentSize.thickPrice;
                const waMessage = encodeURIComponent(`Hola @veinti5co! Me interesa el cuadro "${p.title}" en medida ${currentSize.label} (${sel.frameType === 'thin' ? 'Marco Delgado' : 'Marco Grueso'}) por un valor de ${formatCOP(price)}. Pago por Nequi.`);

                return `
                <div style="background:${b.cardBgColor}" class="rounded-2xl border border-white/10 overflow-hidden shadow-lg flex flex-col justify-between transition-transform duration-300 hover:-translate-y-1">
                    <div>
                        <div class="relative h-64 bg-black/20 overflow-hidden">
                            <img src="${p.images[0] || ''}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
                            ${p.badge ? `<span class="absolute top-3 left-3 bg-black text-white text-[10px] font-extrabold px-3 py-1 rounded-full shadow">${p.badge}</span>` : ''}
                            ${currentSize.soldOut ? `<span class="absolute top-3 right-3 bg-rose-600 text-white text-[10px] font-extrabold px-3 py-1 rounded-full shadow">MEDIDA AGOTADA</span>` : ''}
                        </div>

                        <div class="p-5 space-y-4">
                            <div>
                                <span class="text-[10px] font-extrabold uppercase tracking-widest text-amber-400 opacity-90">${p.category}</span>
                                <h3 class="font-extrabold text-lg mt-1 leading-tight">${p.title}</h3>
                            </div>

                            <!-- Selector de Medidas -->
                            <div>
                                <span class="text-[11px] font-semibold opacity-70 block mb-1.5">Selecciona Medida:</span>
                                <div class="flex flex-wrap gap-1.5">
                                    ${p.sizes.map((sz, sIdx) => `
                                        <button onclick="selectProductSize('${p.id}', ${sIdx})" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${sIdx === sel.sizeIdx ? 'bg-white text-black border-white shadow' : 'border-white/15 opacity-75 hover:opacity-100'} ${sz.soldOut ? 'line-through opacity-40' : ''}">
                                            ${sz.label}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Selector de Tipo de Marco -->
                            <div>
                                <span class="text-[11px] font-semibold opacity-70 block mb-1.5">Tipo de Marco:</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="selectProductFrame('${p.id}', 'thin')" class="py-2 rounded-xl text-xs font-bold border transition ${sel.frameType === 'thin' ? 'bg-white text-black border-white shadow' : 'border-white/15 opacity-75'}">
                                        Marco Delgado
                                    </button>
                                    <button onclick="selectProductFrame('${p.id}', 'thick')" class="py-2 rounded-xl text-xs font-bold border transition ${sel.frameType === 'thick' ? 'bg-white text-black border-white shadow' : 'border-white/15 opacity-75'}">
                                        Marco Grueso
                                    </button>
                                </div>
                            </div>

                            <!-- Precio y Estado -->
                            <div>
                                ${currentSize.soldOut ? `
                                    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold p-3 rounded-xl">
                                        ⚠ La medida ${currentSize.label} se encuentra agotada temporalmente en ambos tipos de marco.
                                    </div>
                                ` : `
                                    <div class="text-xl font-black text-amber-300">${formatCOP(price)}</div>
                                `}
                            </div>
                        </div>
                    </div>

                    <!-- Botón de Compra / WhatsApp -->
                    <div class="p-5 pt-0">
                        ${currentSize.soldOut ? `
                            <button disabled class="w-full py-3 rounded-xl bg-white/10 text-white/40 text-xs font-bold cursor-not-allowed">Agotado en esta medida</button>
                        ` : `
                            <a href="https://wa.me/${storeData.contact.whatsappNumber}?text=${waMessage}" target="_blank" style="background:${b.accentColor}" class="block text-center w-full py-3 rounded-xl text-black font-extrabold text-xs hover:opacity-95 transition shadow-lg">
                                Consultar y Ordenar por WhatsApp
                            </a>
                        `}
                    </div>
                </div>
                `;
            }).join('');

            // 5. Renderizar Promociones
            const promosEl = document.getElementById('promos-container');
            if (storeData.promotions && storeData.promotions.length > 0) {
                promosEl.innerHTML = storeData.promotions.map(pr => {
                    const promoMsg = encodeURIComponent(`Hola @veinti5co! Quiero aprovechar la promoción "${pr.title}" (${pr.availableSizes}) por ${formatCOP(pr.promoPrice)}. Pago por Nequi.`);
                    return `
                    <div style="background:${b.cardBgColor}" class="rounded-2xl border border-white/10 overflow-hidden flex flex-col sm:flex-row shadow-xl">
                        <img src="${pr.image}" class="w-full sm:w-48 h-48 sm:h-auto object-cover">
                        <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
                            <div>
                                <span class="bg-amber-500 text-black text-[10px] font-black px-3 py-1 rounded-full uppercase">${pr.badge}</span>
                                <h3 class="font-black text-lg mt-2">${pr.title}</h3>
                                <p class="text-xs opacity-80 mt-1 leading-relaxed">${pr.description}</p>
                                <p class="text-[11px] font-semibold mt-2 text-amber-300">Medidas: ${pr.availableSizes}</p>
                            </div>
                            <div class="space-y-3">
                                <div class="flex items-baseline gap-3">
                                    <span class="text-xl font-black text-emerald-400">${formatCOP(pr.promoPrice)}</span>
                                    <span class="text-xs line-through opacity-50">${formatCOP(pr.regularPrice)}</span>
                                </div>
                                <a href="https://wa.me/${storeData.contact.whatsappNumber}?text=${promoMsg}" target="_blank" style="background:${b.accentColor}" class="block text-center py-2.5 rounded-xl text-black font-extrabold text-xs shadow">
                                    Pedir Promo por WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            } else {
                promosEl.innerHTML = '';
            }

            // 6. Renderizar Video de YouTube de Fundadores
            const foundersEl = document.getElementById('founders-container');
            if (storeData.foundersVideo && storeData.foundersVideo.enabled && storeData.foundersVideo.youtubeUrl) {
                const embedUrl = getYoutubeEmbed(storeData.foundersVideo.youtubeUrl);
                if (embedUrl) {
                    foundersEl.innerHTML = `
                        <div style="background:${b.cardBgColor}" class="rounded-3xl border border-white/10 p-8 md:p-12 text-center space-y-6 shadow-2xl">
                            <h2 class="text-2xl md:text-3xl font-black tracking-tight">${storeData.foundersVideo.title}</h2>
                            <p class="text-xs md:text-sm opacity-80 max-w-2xl mx-auto leading-relaxed">${storeData.foundersVideo.subtitle}</p>
                            <div class="max-w-3xl mx-auto aspect-video rounded-2xl overflow-hidden shadow-2xl border border-white/10">
                                <iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                            </div>
                        </div>
                    `;
                }
            } else {
                foundersEl.innerHTML = '';
            }

            // 7. Renderizar Trust Stats
            const statsEl = document.getElementById('stats-container');
            if (storeData.trustStats) {
                statsEl.innerHTML = storeData.trustStats.map(st => `
                    <div style="background:${b.cardBgColor}" class="p-6 rounded-2xl border border-white/10 shadow-lg">
                        <div class="text-3xl font-black text-amber-300">${st.value}</div>
                        <div class="text-xs opacity-75 mt-1 font-medium">${st.label}</div>
                    </div>
                `).join('');
            }

            // 8. Footer Contacto
            document.getElementById('footer-contact').innerHTML = `
                WhatsApp: <a href="https://wa.me/${storeData.contact.whatsappNumber}" target="_blank" class="underline hover:text-amber-300">${storeData.contact.whatsappDisplay}</a> | 
                Instagram: <a href="${storeData.contact.instagramUrl}" target="_blank" class="underline hover:text-amber-300">${storeData.contact.instagramHandle}</a>
            `;

            updateAudioPlayerUI();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderStore();
        }

        function selectProductSize(prodId, sizeIdx) {
            productSelections[prodId].sizeIdx = sizeIdx;
            renderStore();
        }

        function selectProductFrame(prodId, frameType) {
            productSelections[prodId].frameType = frameType;
            renderStore();
        }

        function getYoutubeEmbed(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
        }

        // ==========================================
        // REPRODUCTOR DE MÚSICA GOTH (MP3 REAL)
        // ==========================================
        function updateAudioPlayerUI() {
            if (!storeData || !storeData.playlist || !storeData.playlist.length) return;
            const track = storeData.playlist[currentTrackIdx];
            document.getElementById('track-title').innerText = track.title || "Pista Goth";
            document.getElementById('track-artist').innerText = track.artist || "@veinti5co";
        }

        function toggleAudioPlay() {
            if (!storeData || !storeData.playlist || !storeData.playlist.length) return;
            const audio = document.getElementById('public-audio-player');
            const track = storeData.playlist[currentTrackIdx];
            const btn = document.getElementById('play-btn');

            if (!track.audioData) {
                alert("Esta pista aún no tiene un archivo MP3 cargado desde el panel de administración.");
                return;
            }

            if (isAudioPlaying) {
                audio.pause();
                isAudioPlaying = false;
                btn.innerText = "▶";
            } else {
                if (audio.src !== track.audioData) {
                    audio.src = track.audioData;
                }
                audio.play().then(() => {
                    isAudioPlaying = true;
                    btn.innerText = "❚❚";
                }).catch(e => {
                    console.log("Error reproduciendo audio:", e);
                });
            }
        }

        function nextAudioTrack() {
            if (!storeData || !storeData.playlist || !storeData.playlist.length) return;
            currentTrackIdx = (currentTrackIdx + 1) % storeData.playlist.length;
            const audio = document.getElementById('public-audio-player');
            const track = storeData.playlist[currentTrackIdx];
            isAudioPlaying = false;
            document.getElementById('play-btn').innerText = "▶";
            if (track.audioData) {
                audio.src = track.audioData;
                toggleAudioPlay();
            } else {
                updateAudioPlayerUI();
            }
        }

        // Inicializar carga al abrir la página
        loadStoreData();
    </script>
</body>
</html>
